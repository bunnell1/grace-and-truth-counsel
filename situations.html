<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="brand">
      <img src="logo.png" alt="" class="brand-mark">
      <div>
        <span class="brand-name">Grace & Truth Counsel</span>
        <span class="brand-sub">Biblical Counseling</span>
      </div>
    </a>
    <nav>
      <a href="index.html">Home</a>

      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<main>
  <h1>Counseling Issues</h1>
  <p class="note">Search by struggle. Applicable Scripture, biblical principles, and session questions. Notes stay on your device.</p>
  <div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem;">
    <input type="text" id="search" class="search" placeholder="Search issues…" style="margin:0;flex:1;">
    <button class="btn" onclick="doSearch()">Find</button>
  </div>
  <div id="issue-list" class="module-list"></div>
  <div id="issue-detail" class="hidden card"></div>
</main>

<footer>
  <a href="https://graceandtruthministry.com">Grace & Truth Ministry</a> ·
  <a href="https://graceandtruthministry.com/privacy.html">Privacy</a> ·
  <a href="https://graceandtruthministry.com/terms.html">Terms</a>
  <p>© 2026 Grace & Truth Counsel</p>
</footer>

<script src="counselingIssues.js"></script>
<script>
const SUPABASE_URL = 'https://vsrasasxkbxiitbvonjw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4-d9tlhIQu1OqeI5bGTHTQ_OSLgPFoC';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function renderIssues(filter = '', aiIds = null) {
  const list = document.getElementById('issue-list');
  list.innerHTML = '';
  let issues = (typeof counselingIssues !== 'undefined' ? counselingIssues : []);
  if (aiIds && aiIds.length) {
    issues = issues.filter(i => aiIds.includes(i.id));
  } else if (filter) {
    const f = filter.toLowerCase();
    issues = issues.filter(i => (i.title || '').toLowerCase().includes(f) || (i.summary || '').toLowerCase().includes(f));
  }
  issues.forEach(issue => {
    const div = document.createElement('div');
    div.className = 'module-item';
    div.innerHTML = `<div><strong>${issue.title}</strong><p>${issue.summary || ''}</p></div>`;
    div.onclick = () => showIssue(issue);
    list.appendChild(div);
  });
  if (!issues.length) list.innerHTML = '<p class="note">No matching issues.</p>';
}

async function doSearch() {
  const q = document.getElementById('search').value.trim();
  if (!q) { renderIssues(); return; }
  // Try AI first
  try {
    const catalog = (counselingIssues || []).map(i => ({ type: 'issue', id: i.id, title: i.title, summary: i.summary || '' }));
    const { data, error } = await sb.functions.invoke('find', { body: { q, catalog } });
    if (!error && data && data.matches && data.matches.length) {
      const ids = data.matches.map(m => m.id).filter(Boolean);
      renderIssues(q, ids);
      return;
    }
  } catch (e) { console.error(e); }
  // Fallback to local
  renderIssues(q);
}

function showIssue(issue) {
  const detail = document.getElementById('issue-detail');
  const notesKey = 'issue-notes-' + (issue.id || issue.title);
  detail.innerHTML = `
    <button class="btn secondary" onclick="hideDetail()">Back to list</button>
    <h2>${issue.title}</h2>
    <p>${issue.summary || ''}</p>
    ${issue.content || ''}
    <h3>Your Notes</h3>
    <textarea class="notes-area" id="iss-notes" placeholder="Notes stay on this device">${localStorage.getItem(notesKey) || ''}</textarea>
    <button class="btn" onclick="localStorage.setItem('${notesKey}', document.getElementById('iss-notes').value); alert('Saved')">Save Notes</button>
  `;
  detail.classList.remove('hidden');
  document.getElementById('issue-list').classList.add('hidden');
  document.getElementById('search').parentElement.classList.add('hidden');
}
function hideDetail() {
  document.getElementById('issue-detail').classList.add('hidden');
  document.getElementById('issue-list').classList.remove('hidden');
  document.getElementById('search').parentElement.classList.remove('hidden');
}
document.getElementById('search').addEventListener('input', e => renderIssues(e.target.value));
document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

// Honor ?q= and ?id= from home page
const params = new URLSearchParams(location.search);
const initialQ = params.get('q') || '';
const initialId = params.get('id') || '';
if (initialQ) document.getElementById('search').value = initialQ;
if (initialId) {
  const issue = (counselingIssues || []).find(i => i.id === initialId);
  if (issue) { showIssue(issue); } else { renderIssues(initialQ); }
} else {
  renderIssues(initialQ);
}
</script>
</body>
</html>
